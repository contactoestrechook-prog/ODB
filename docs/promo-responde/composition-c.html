function twCount(t){
  const Lc = REPLY_C.length;
  if (t < TL.s3.tw0) return 0;
  if (t < TL.s3.twA) return Math.round(seg(t,TL.s3.tw0,TL.s3.twA,E.inOutCubic)*10);
  if (t < TL.s3.twB) return 10 + Math.round(seg(t,TL.s3.twA,TL.s3.twB,E.inQuad)*(Lc-30-10));
  return (Lc-30) + Math.round(seg(t,TL.s3.twB,TL.s3.tw1,E.outCubic)*30);
}

});

/* escenas */
function s1(t){
  const on = t < TL.whipA.b-0.1;
  $('s1').style.display = on?'block':'none';
  if (!on) return;
  const cq = seg(t, TL.s1.clock, TL.s1.clock+0.5, E.outExpo);
  const cl = $('s1clock');
  cl.style.opacity = cq;
  cl.style.transform = `scale(${lerp(1.45,1,cq)})`;
  cl.innerHTML = `23<span style="opacity:${Math.floor(t*2)%2?1:.25}">:</span>12`;
  aberr(cl, Math.max(0,.8-t*1.5));
  scramble($('s1lbl'), 'DOMINGO · TU VENDEDOR DUERME', t, TL.s1.lbl, TL.s1.lbl+0.9);
  popIn($('s1b1'), t, TL.s1.b1);
  staggerWords(h1w, t, TL.s1.h1, 0.1, 0.3);
  staggerWords(h2w, t, TL.s1.h2, 0.11, 0.3);
}
function s2(t){
  const on = t>=TL.whipA.a && t<TL.whipB.b-0.05;
  $('s2').style.display = on?'block':'none';
  if (!on) return;
  const rq = seg(t, TL.s2.r, TL.s2.r+0.45, E.outBack);
  $('s2r').style.opacity = rq;
  $('s2r').style.transform = `scale(${lerp(.5,1,rq)}) rotate(${lerp(-8,0,rq)}deg)`;
  scramble($('s2lbl'), 'ETAPA 00 · RESPONDE · PLAN MANAGER', t, TL.s2.lbl, TL.s2.lbl+0.95);
  const w1 = seg(t, TL.s2.w1, TL.s2.w1+0.4, E.outExpo);
  $('s2w1').style.opacity = w1;
  $('s2w1').style.transform = `translateY(${lerp(60,0,w1)}px) scale(${lerp(1.2,1,w1)})`;
  const w2 = seg(t, TL.s2.w2, TL.s2.w2+0.42, E.outExpo);
  $('s2w2').style.opacity = w2;
  $('s2w2').style.transform = `translateY(${lerp(70,0,w2)}px) scale(${lerp(1.4,1,w2)})`;
  aberr($('s2w2'), t>TL.s2.w2 ? Math.max(0,1-(t-TL.s2.w2)*1.4) : 0);
  const tg = seg(t, TL.s2.tag, TL.s2.tag+0.5, E.outCubic);
  $('s2tag').style.opacity = tg;
  $('s2tag').style.transform = `translateY(${lerp(28,0,tg)}px)`;
  $('s2tag').textContent = 'Cierra la venta solo. Con el pago adentro.';
  $('s2sub').style.opacity = seg(t, TL.s2.tag+0.35, TL.s2.tag+0.8, E.outCubic);
}
function s3(t){
  const on = t>=TL.whipB.a && t<TL.whipD.b-0.2;
  $('s3').style.display = on?'block':'none';
  if (!on) return;
  const ph = seg(t, TL.s3.phone, TL.s3.phone+0.6, E.outExpo);
  $('phoneC').style.transform = `translateY(${lerp(700,0,ph)}px) scale(${lerp(.93,1,ph)})`;
  $('phoneC').style.opacity = ph;
  /* recibo tapa el teléfono */
  const rin = seg(t, TL.s3.rec, TL.s3.rec+0.45, E.outExpo);
  const rout = seg(t, TL.s3.recOut-0.25, TL.s3.recOut, E.inQuad);
  const rON = t>=TL.s3.rec-0.05 && rout<1;
  $('c_receipt').style.display = rON?'block':'none';
  if (rON){
    $('c_receipt').style.opacity = rin*(1-rout);
    $('c_receipt').style.transform = `translateY(${lerp(-140,0,rin)}px) scale(${lerp(1.5,1,rin)}) rotate(${lerp(-5,-1.2,rin)}deg)`;
  }
  const cfDim = seg(t, TL.s3.cnt0-0.15, TL.s3.cnt0+0.25, E.outCubic);
  $('phoneC').style.filter = (rON && rin>.3) ? 'brightness(.45) blur(3px)'
    : cfDim>0.02 ? `brightness(${lerp(1,.38,cfDim)}) blur(${(cfDim*2.5).toFixed(1)}px)` : 'none';
  /* steps */
  let idx=-1;
  for (let i=0;i<STEPS_C.length;i++) if (t>=STEPS_C[i].t) idx=i;
  if (idx>=0){
    const st=STEPS_C[idx];
    const nxt = idx<STEPS_C.length-1 ? STEPS_C[idx+1].t : 1e9;
    let o = 1-seg(t, nxt-0.16, nxt, E.inQuad);
    if (idx===1) o *= 1-seg(t, 16.4, 17.0, E.inQuad);
    if (idx===4) o *= 1-seg(t, TL.s3.cnt0-0.25, TL.s3.cnt0, E.inQuad);
    $('s3step').style.opacity = o;
    scramble($('s3step'), st.txt.toUpperCase(), t, st.t, st.t+0.55, true);
  } else $('s3step').style.opacity = 0;
  /* chat */
  popIn($('c_in1'), t, TL.s3.msg1);

  const o1 = t>=TL.s3.typ1;
  $('c_out1').style.display = o1?'block':'none';
  if (o1) popIn($('c_out1'), t, TL.s3.typ1, 0.3);
  const n = twCount(t);
  $('c_tw').textContent = REPLY_C.slice(0,n);
  $('c_caret').style.opacity = (t>TL.s3.typ1 && t<TL.s3.tw1+0.4) ? (Math.floor(t*2.6)%2?1:.1) : 0;
  const lk = seg(t, TL.s3.link, TL.s3.link+0.4, E.outBack);
  $('c_link').style.display = t>=TL.s3.link-0.02 ? 'flex' : 'none';
  $('c_link').style.opacity = lk;
  $('c_link').style.transform = `scale(${lerp(.7,1,lk)})`;
  popIn($('c_in2'), t, TL.s3.msg2);
  const o2 = t>=TL.s3.out2;
  $('c_out2').style.display = o2?'block':'none';
  if (o2) popIn($('c_out2'), t, TL.s3.out2, 0.3);
  /* chips */
  C_CHIPS.forEach((ch,i)=>{
    const t0 = TL.s3.st2+0.25 + i*0.3;
    const q = seg(t, t0, t0+0.4, E.outBackS);
    const qo = 1 - seg(t, TL.s3.tw1-0.3, TL.s3.tw1+0.1, E.inQuad);
    ch.el.style.opacity = q*qo;
    ch.el.style.transform = `translateY(${lerp(34,0,q) + Math.sin(t*1.6+i*2.1)*6}px)`;
  });
  /* avisos al equipo */
