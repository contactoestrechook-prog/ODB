<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&family=Inter+Tight:wght@300;500;700&display=block" rel="stylesheet">
</head>
<body>
<script src="motor.js"></script>
<script>
injectBase();

/* ============ VIDEO D · EL QUE VENDE · CORTO (24s) ============
   Receta: 7 golpes. Un concepto por pantalla, tipografía enorme,
   cada golpe se sostiene 1,5-2,5s. Los cortes son secos (flash +
   negro de 3 frames). Dentro de cada golpe la cámara se mueve LENTO.
   ============================================================ */
const TL = {
  h:  {in:0.00, num:0.10, lbl:1.35, cut:3.05},                 // $74.900
  b2: {in:3.05, w1:3.28, w2:4.35, cut:6.15},                   // UN DOMINGO. / A LAS 23:14.
  b3: {in:6.15, w1:6.38, w2:7.45, cut:9.25},                   // VOS DORMÍAS. / ÉL VENDIÓ.
  b4: {in:9.25, r:9.45, logo:9.85, logoEnd:11.05, tag:11.5, cut:13.15},
  b5: {in:13.15, c1:13.3, c2:14.85, c3:16.4, cut:18.25},       // COTIZA / LINK / COBRA
  b6: {in:18.25, w:18.45, sub:19.35, cut:20.45},               // ATIENDE. COTIZA. COBRA.
  cta:{in:20.45, logo:20.62, tag:21.25, btn:21.85, site:22.5, end:24.6},
};
window.DURATION = TL.cta.end;

const CUTS = [TL.h.cut, TL.b2.cut, TL.b3.cut, TL.b4.cut, TL.b5.cut, TL.b6.cut];

const camera = makeCamera({
  S:[
    /* h: entra grande y se asienta lento */
    {t:0,v:1.30},{t:0.55,v:1.06,e:E.outExpo},{t:3.05,v:1.00,e:E.linear},
    /* b2: push in lento */
    {t:3.05,v:1.00},{t:6.15,v:1.09,e:E.linear},
    /* b3: push out lento */
    {t:6.15,v:1.10},{t:9.25,v:1.00,e:E.linear},
    /* b4 reveal: golpe y respiración */
    {t:9.25,v:1.55},{t:11.05,v:1.00,e:E.outExpo},{t:13.15,v:1.045,e:E.linear},
    /* b5: cada tarjeta con micro-push */
    {t:13.15,v:1.02},{t:14.85,v:1.07,e:E.inOutCubic},
    {t:14.85,v:1.02},{t:16.40,v:1.07,e:E.inOutCubic},
    {t:16.40,v:1.00},{t:18.25,v:1.08,e:E.inOutCubic},
    /* b6 */
    {t:18.25,v:1.08},{t:20.45,v:1.00,e:E.linear},
    /* cta */
    {t:20.45,v:1.12},{t:21.30,v:1.00,e:E.outExpo},{t:24.6,v:1.05,e:E.linear},
  ],
  X:[{t:0,v:540}],
  Y:[
    {t:0,v:900},{t:0.55,v:930,e:E.outExpo},{t:3.05,v:960,e:E.linear},
    {t:3.05,v:940},{t:6.15,v:980,e:E.linear},
    {t:6.15,v:980},{t:9.25,v:940,e:E.linear},
    {t:9.25,v:900},{t:11.05,v:960,e:E.outExpo},{t:13.15,v:975,e:E.linear},
    {t:13.15,v:960},{t:18.25,v:960,e:E.linear},
    {t:18.25,v:940},{t:20.45,v:975,e:E.linear},
    {t:20.45,v:930},{t:21.30,v:960,e:E.outExpo},
  ],
  shakes:[
    {t:0.15,amp:16,freq:11,dur:0.55},
    {t:3.28,amp:9,freq:11,dur:0.4},{t:6.38,amp:9,freq:11,dur:0.4},
    {t:9.32,amp:13,freq:10,dur:0.55},{t:11.05,amp:7,freq:9,dur:0.45},
    {t:13.32,amp:6,freq:11,dur:0.3},{t:14.87,amp:6,freq:11,dur:0.3},{t:16.42,amp:10,freq:10,dur:0.45},
    {t:18.47,amp:7,freq:10,dur:0.4},{t:20.62,amp:6,freq:10,dur:0.4},
  ],
  whips:[],
  flashes:[
    {t:0.15,p:.5},{t:3.10,p:.3},{t:6.20,p:.3},{t:9.30,p:.45},
    {t:13.20,p:.28},{t:14.86,p:.2},{t:16.41,p:.5},{t:18.30,p:.28},{t:20.50,p:.3},
  ],
  /* cortes secos: negro de ~4 frames en cada cambio de golpe */
  cutsBlack: CUTS.map(t=>({a:t-0.055,b:t+0.055})),
  cutsBone:[{a:16.36,b:16.46}],   /* el cobro entra con un fogonazo hueso */
  fade:[23.95,24.55],
});

/* ============ DOM ============ */
const stage = $('stage');
stage.innerHTML = `
<div class="layer" id="h">
  <div id="hnum" class="ser tan" style="position:absolute;left:0;top:700px;width:1080px;text-align:center;font-size:215px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:lining-nums;"></div>
  <div id="hlbl" class="lbl bone" style="position:absolute;left:0;top:990px;width:1080px;text-align:center;font-size:30px;"></div>
</div>

<div class="layer" id="b2">
  <div id="b2w1" class="ser bone" style="position:absolute;left:0;top:770px;width:1080px;text-align:center;font-size:140px;font-weight:600;">UN DOMINGO.</div>
  <div id="b2w2" class="seri tan" style="position:absolute;left:0;top:960px;width:1080px;text-align:center;font-size:140px;font-weight:600;">A las 23:14.</div>
</div>

<div class="layer" id="b3">
  <div id="b3w1" class="ser bone" style="position:absolute;left:0;top:760px;width:1080px;text-align:center;font-size:132px;font-weight:600;">VOS DORMÍAS.</div>
  <div id="b3w2" class="ser tan" style="position:absolute;left:0;top:950px;width:1080px;text-align:center;font-size:172px;font-weight:700;">ÉL VENDIÓ.</div>
</div>

<div class="layer" id="b4">
  <div class="ghostnum" style="left:530px;top:330px;font-size:700px;">$</div>
  <div id="b4r" class="rbox" style="position:absolute;left:475px;top:600px;width:130px;height:130px;font-size:70px;">R</div>
  <div id="b4logo" class="ser bone" style="position:absolute;left:0;top:790px;width:1080px;text-align:center;font-size:172px;font-weight:600;letter-spacing:-.02em;"></div>
  <div id="b4rule" style="position:absolute;left:300px;top:1010px;width:480px;height:2px;background:#c9a96e;transform-origin:50% 50%;"></div>
  <div id="b4tag" class="lbl tan" style="position:absolute;left:0;top:1060px;width:1080px;text-align:center;font-size:34px;">El que vende</div>
</div>

<div class="layer" id="b5">
  <div id="c1" class="beatcard">
    <div class="beatn lbl">01 · COTIZA</div>
    <div style="background:#2c2517;border:1.5px solid rgba(201,169,110,.45);border-radius:28px;border-bottom-right-radius:8px;padding:46px 50px;box-shadow:0 40px 90px rgba(0,0,0,.6);">
      <div style="font-family:'Inter Tight',sans-serif;font-weight:500;font-size:50px;line-height:1.36;color:#f5f3ee;">Me queda una en stock. <b class="tan">$74.900</b> — te paso el link y mañana la retirás.</div>
      <div class="lbl" style="text-align:right;font-size:24px;color:rgba(245,243,238,.5);margin-top:20px;">23:12 <span class="tan">✓✓</span></div>
    </div>
  </div>
  <div id="c2" class="beatcard">
    <div class="beatn lbl">02 · MANDA EL LINK</div>
    <div id="c2pill" style="display:flex;align-items:center;gap:24px;background:#101b25;border:2px solid rgba(120,180,230,.55);border-radius:24px;padding:54px 40px;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;color:#9fc6ea;justify-content:center;box-shadow:0 40px 90px rgba(0,0,0,.6);">💳&nbsp; mpago.la/tienda &nbsp;→</div>
    <div class="lbl dim" style="text-align:center;font-size:30px;margin-top:34px;">Mercado Pago · lo generó él</div>
  </div>
  <div id="c3" class="beatcard">
    <div class="beatn lbl" style="color:#7bbf6a;">03 · COBRA</div>
    <div style="background:#f5f3ee;border-radius:8px;padding:56px 58px;box-shadow:0 70px 160px rgba(0,0,0,.85);">
      <div class="lbl" style="font-size:28px;color:#4d7a44;">Pago acreditado ✓</div>
      <div class="ser" style="font-size:172px;font-weight:700;color:#0d0c0a;margin-top:10px;font-variant-numeric:lining-nums;letter-spacing:-.03em;">$ 74.900</div>
      <div style="border-top:2px dashed rgba(13,12,10,.25);margin:30px 0 24px;"></div>
      <div class="lblb" style="font-size:36px;color:#171512;">Mochila urbana negra</div>
      <div class="lbl" style="font-size:24px;color:rgba(13,12,10,.55);margin-top:14px;">23:14 · Reservada para retiro ✓</div>
    </div>
  </div>
</div>

<div class="layer" id="b6">
  <div id="b6w" class="ser bone" style="position:absolute;left:0;top:790px;width:1080px;text-align:center;font-size:118px;font-weight:600;line-height:1.22;"></div>
  <div id="b6sub" class="lbl tan" style="position:absolute;left:0;top:1130px;width:1080px;text-align:center;font-size:32px;">24/7 · WhatsApp · Instagram · Email</div>
</div>

<div class="layer" id="cta">
  <div id="ctar" class="rbox" style="position:absolute;left:470px;top:590px;width:140px;height:140px;font-size:76px;">R</div>
  <div id="ctalogo" class="ser bone" style="position:absolute;left:0;top:770px;width:1080px;text-align:center;font-size:158px;font-weight:600;">RESPONDE</div>
  <div id="ctamode" class="lbl tan" style="position:absolute;left:0;top:975px;width:1080px;text-align:center;font-size:27px;">El que vende · Plan Manager · by Metogroup</div>
  <div id="ctabtn" class="pill" style="position:absolute;left:50%;top:1090px;transform:translateX(-50%);font-size:44px;white-space:nowrap;padding:34px 70px;">Probame ahora →</div>
  <div id="ctasite" class="lbl bone" style="position:absolute;left:0;top:1280px;width:1080px;text-align:center;font-size:30px;letter-spacing:.34em;">metogroup.ar</div>
</div>`;

/* estilos propios de este corto */
const st = document.createElement('style');
st.textContent = `
  .beatcard { position:absolute; left:90px; top:0; width:900px; }
  .beatn { font-size:30px; color:#c9a96e; margin-bottom:30px; text-align:center; }
`;
document.head.appendChild(st);

/* tarjetas del golpe 5, centradas sobre el eje de cámara (y=960) */
$('c1').style.top = '700px';
$('c2').style.top = '810px';
$('c3').style.top = '690px';

const b6w = words($('b6w'), 'ATIENDE. COTIZA. COBRA.', []);

/* ---- golpes ---- */
function beatOn(id, t, a, b){
  const on = t>=a-0.02 && t<b+0.02;
  $(id).style.display = on?'block':'none';
  return on;
}
function h(t){
  if(!beatOn('h', t, TL.h.in, TL.h.cut)) return;
  const q = seg(t, TL.h.num, TL.h.num+0.45, E.outExpo);
  const el = $('hnum');
  /* el número se arma contando y frena — grande y lento */
  const v = Math.round(kf(t,[{t:0.25,v:0},{t:1.15,v:74900,e:E.outQuint}]));
  el.textContent = '$ ' + v.toLocaleString('es-AR');
  el.style.opacity = q;
  el.style.transform = `scale(${lerp(1.35,1,q)})`;
  aberr(el, Math.max(0, .9-(t-TL.h.num)*1.1));
  scramble($('hlbl'), 'VENDIDO A LAS 23:14 · SIN QUE VOS HICIERAS NADA', t, TL.h.lbl, TL.h.lbl+0.8);
}
function b2(t){
  if(!beatOn('b2', t, TL.b2.in, TL.b2.cut)) return;
  const q1 = seg(t, TL.b2.w1, TL.b2.w1+0.42, E.outExpo);
  $('b2w1').style.opacity = q1;
  $('b2w1').style.transform = `scale(${lerp(1.3,1,q1)})`;
  aberr($('b2w1'), Math.max(0,.7-(t-TL.b2.w1)*1.3));
  const q2 = seg(t, TL.b2.w2, TL.b2.w2+0.42, E.outExpo);
  $('b2w2').style.opacity = q2;
  $('b2w2').style.transform = `translateY(${lerp(40,0,q2)}px) scale(${lerp(1.2,1,q2)})`;
}
function b3(t){
  if(!beatOn('b3', t, TL.b3.in, TL.b3.cut)) return;
  const q1 = seg(t, TL.b3.w1, TL.b3.w1+0.42, E.outExpo);
  $('b3w1').style.opacity = q1;
  $('b3w1').style.transform = `scale(${lerp(1.25,1,q1)})`;
  const q2 = seg(t, TL.b3.w2, TL.b3.w2+0.4, E.outExpo);
  $('b3w2').style.opacity = q2;
  $('b3w2').style.transform = `scale(${lerp(1.55,1,q2)})`;
  aberr($('b3w2'), Math.max(0,1-(t-TL.b3.w2)*1.2));
}
function b4(t){
  if(!beatOn('b4', t, TL.b4.in, TL.b4.cut)) return;
  const rq = seg(t, TL.b4.r, TL.b4.r+0.4, E.outBack);
  $('b4r').style.opacity = rq;
  $('b4r').style.transform = `scale(${lerp(.5,1,rq)}) rotate(${lerp(-8,0,rq)}deg)`;
  scramble($('b4logo'), 'RESPONDE', t, TL.b4.logo, TL.b4.logoEnd);
  aberr($('b4logo'), Math.max(0, .9-(t-TL.b4.logo)*0.8));
  const ru = seg(t, TL.b4.logoEnd, TL.b4.logoEnd+0.45, E.outExpo);
  $('b4rule').style.transform = `scaleX(${ru})`;
  $('b4rule').style.opacity = ru;
  const tg = seg(t, TL.b4.tag, TL.b4.tag+0.45, E.outCubic);
  $('b4tag').style.opacity = tg;
  $('b4tag').style.letterSpacing = lerp(.55,.24,tg)+'em';
}
function b5(t){
  if(!beatOn('b5', t, TL.b5.in, TL.b5.cut)) return;
  const cards = [
    {id:'c1', t0:TL.b5.c1, t1:TL.b5.c2},
    {id:'c2', t0:TL.b5.c2, t1:TL.b5.c3},
    {id:'c3', t0:TL.b5.c3, t1:TL.b5.cut},
  ];
  cards.forEach(c=>{
    const on = t>=c.t0-0.02 && t<c.t1;
    $(c.id).style.display = on?'block':'none';
    if(!on) return;
    const q = seg(t, c.t0, c.t0+0.4, E.outExpo);
    $(c.id).style.opacity = q;
    $(c.id).style.transform = `translateY(${lerp(50,0,q)}px) scale(${lerp(1.16,1,q)})`;
  });
}
function b6(t){
  if(!beatOn('b6', t, TL.b6.in, TL.b6.cut)) return;
  staggerWords(b6w, t, TL.b6.w, 0.26, 0.34);
  $('b6sub').style.opacity = seg(t, TL.b6.sub, TL.b6.sub+0.4, E.outCubic);
}
function cta(t){
  if(!beatOn('cta', t, TL.cta.in, 1e9)) return;
  const rq = seg(t, TL.cta.in, TL.cta.in+0.35, E.outExpo);
  $('ctar').style.opacity = rq;
  $('ctar').style.transform = `scale(${lerp(.55,1,rq)})`;
  const lg = seg(t, TL.cta.logo, TL.cta.logo+0.4, E.outExpo);
  $('ctalogo').style.opacity = lg;
  $('ctalogo').style.transform = `scale(${lerp(1.3,1,lg)})`;
  $('ctamode').style.opacity = seg(t, TL.cta.tag, TL.cta.tag+0.4, E.outCubic);
  const bq = seg(t, TL.cta.btn, TL.cta.btn+0.45, E.outBack);
  const breathe = 1 + 0.025*Math.sin((t-TL.cta.btn)*2.3);
  $('ctabtn').style.opacity = bq;
  $('ctabtn').style.transform = `translateX(-50%) scale(${bq<1?lerp(.6,1,bq):breathe})`;
  $('ctasite').style.opacity = seg(t, TL.cta.site, TL.cta.site+0.4, E.outCubic);
}

window.seek = function(t){
  /* todo el corto vive en oscuro: el recibo blanco pega más sobre negro */
  setWorld(t, 0);
  camera(t);
  h(t); b2(t); b3(t); b4(t); b5(t); b6(t); cta(t);
};
window.READY = Promise.all([
  document.fonts.load('700 215px Newsreader'),
  document.fonts.load('600 172px Newsreader'),
  document.fonts.load('italic 600 140px Newsreader'),
  document.fonts.load('300 30px "Inter Tight"'),
  document.fonts.load('700 44px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
</body>
</html>
