  <div id="rbox" class="rbox" style="display:inline-grid;width:126px;height:126px;font-size:68px;"></div>
  <div id="rlogo" class="ser bone" style="font-size:150px;font-weight:600;letter-spacing:-.02em;margin-top:40px;"></div>
  <div id="rrule" style="width:460px;height:2px;background:#c9a96e;margin:26px auto 0;transform-origin:50% 50%;"></div>
  <div id="rtag" class="seri tan" style="font-size:48px;font-weight:500;margin-top:28px;">El que contesta primero.</div>
  <div id="rbtn" class="pill" style="display:inline-block;font-size:40px;white-space:nowrap;padding:30px 62px;margin-top:48px;">Probame ahora →</div>
  <div id="rsite" class="mo" style="font-size:24px;letter-spacing:.26em;margin-top:40px;color:rgba(245,243,238,.6);">RESPONDE · BY METOGROUP · METOGROUP.AR</div>
</div>`;

const st2 = document.createElement('style');
st2.textContent = `.mask{overflow:hidden;line-height:1.28;padding-bottom:10px;} .mask>span{display:inline-block;}`;
document.head.appendChild(st2);

const RV = [...document.querySelectorAll('.rv')].map(el=>({el, rx:parseFloat(el.dataset.rx)}));
const HC = [...document.querySelectorAll('.hc')].map(el=>({el, rx:parseFloat(el.dataset.rx)}));
const cv1 = $('cv1');
let LEN1 = 0;
const TW = 'EL MUNDO CAMBIÓ.', TW0 = 0.55, TW1 = 3.60;

window.seek = function(t){
  setWorld(t, 0);
  if (!LEN1){ LEN1 = cv1.getTotalLength(); cv1.style.strokeDasharray = LEN1; }
  const c = camAt(t), c2 = camAt(t+1/60);
  const v = Math.hypot((c2.x-c.x)*c.s, (c2.y-c.y)*c.s) + Math.abs(c2.s-c.s)/c.s*900;
  const blur = Math.min(7, Math.max(0, (v-8)*0.19));
  const bx = Math.sin(t*0.62)*4 + Math.sin(t*1.7)*1.6;
  const by = Math.cos(t*0.5)*4.5 + Math.sin(t*1.3)*1.6;
  const rot = c.roll + Math.sin(t*0.33)*0.32 + Math.sin(t*0.9)*0.11;
  const cam = $('camera');
  cam.style.transform = `translate(540px,960px) rotate(${rot}deg) scale(${c.s}) translate(${-(c.x+bx)}px,${-(c.y+by)}px)`;
  cam.style.filter = blur>0.25 ? `blur(${blur.toFixed(2)}px)` : 'none';
  const gi = Math.floor(t*24)%9;
  $('grainD').style.transform = `translate(${(gi%3)*-22}px,${Math.floor(gi/3)*-18}px)`;
  $('blackout').style.opacity = Math.max(1-seg(t,0,0.5,E.outQuad), seg(t,45.55,46.15,E.inQuad));
  $('flash').style.opacity = 0;

  const n = Math.round(seg(t, TW0, TW1, E.linear) * TW.length);
  $('tw').textContent = TW.slice(0, n);
  $('twc').style.opacity = t < TW1+0.6 ? (Math.floor(t*2.6)%2?1:.15) : 0;

  /* los datos se dibujan al pasar la cámara */
  const px = c.xs;
  const rp = x => clamp01((px - (x - 330)) / 420);
  cv1.style.strokeDashoffset = LEN1 * (1 - rp(T1.x + 260));
  for (const r of RV){ const q = rp(r.rx); r.el.style.opacity = q; r.el.style.transform = `translateY(${lerp(16,0,q)}px)`; }
  for (const b of [...document.querySelectorAll('.bar')]){
    const q = rp(parseFloat(b.style.left)+50);
    b.style.transform = `scaleY(${(parseFloat(b.style.getPropertyValue('--h'))*q).toFixed(3)})`;
  }
  for (const h of HC) h.el.style.opacity = rp(h.rx + 300);
  $('flat').style.transform = `scaleX(${rp(T4.x+520).toFixed(3)})`;

  /* HUD · alerta roja en la pista 04 */
  let tr='01/04';
  if (c.ys > 3400) tr='02/04';
  if (c.ys > 5500) tr='03/04';
  if (c.ys > 7900) tr='04/04';
  if (c.ys > 9700) tr='—/—';
  $('htr').textContent = tr;
  const alerta = c.ys > 7900 && c.ys < 9700;
  const pulse = alerta ? (0.45 + 0.55*Math.abs(Math.sin(t*2.4))) : 0;
  $('halert').style.opacity = pulse;
  $('htr').style.color = alerta ? '#e0483f' : '#c9a96e';
  $('hfr').style.borderColor = alerta ? `rgba(224,72,63,${(0.16+0.22*pulse).toFixed(2)})` : 'rgba(245,243,238,.13)';
  [...document.querySelectorAll('.tk')].forEach(el=> el.style.borderColor = alerta ? '#e0483f' : '#c9a96e');
  $('hsite').style.opacity = t>38.4 ? 0 : .42;

  const w = (id,t0,d)=>{ const q=seg(t,t0,t0+d,E.outExpo); $(id).style.transform=`translateY(${(1-q)*115}%)`; };
  w('f1', 36.75, 0.8); w('f2', 38.10, 0.85); w('f3', 39.40, 0.7); w('f3b', 39.85, 0.7);
  const fq = seg(t, 37.65, 38.25, E.outExpo);
  $('fr').style.transform = `scaleX(${fq})`; $('fr').style.opacity = fq;
  const rq = seg(t, 43.20, 43.70, E.outExpo);
  $('rbox').style.opacity = rq; $('rbox').textContent='R';
  $('rbox').style.transform = `scale(${lerp(.55,1,rq)})`;
  scramble($('rlogo'), 'RESPONDE', t, 43.50, 44.70);
  const ru = seg(t, 44.70, 45.15, E.outExpo);
  $('rrule').style.transform = `scaleX(${ru})`; $('rrule').style.opacity = ru;
  const tg = seg(t, 44.90, 45.35, E.outCubic);
  $('rtag').style.opacity = tg; $('rtag').style.transform=`translateY(${lerp(18,0,tg)}px)`;
  const bq = seg(t, 45.15, 45.65, E.outBack);
  $('rbtn').style.opacity = bq;
  $('rbtn').style.transform = `scale(${bq<1?lerp(.7,1,bq):1+0.02*Math.sin((t-45.15)*2.4)})`;
  $('rsite').style.opacity = seg(t, 45.45, 45.95, E.outCubic);
};
window.READY = Promise.all([
  document.fonts.load('600 150px Newsreader'),
  document.fonts.load('600 98px Newsreader'),
  document.fonts.load('italic 600 86px Newsreader'),
  document.fonts.load('500 56px "IBM Plex Mono"'),
  document.fonts.load('600 104px "IBM Plex Mono"'),
  document.fonts.load('700 40px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
</body>
</html>
