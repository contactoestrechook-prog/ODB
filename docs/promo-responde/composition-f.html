/* ---------- helpers ---------- */
function wipe(id, t, t0, dur){
  const el = $(id);
  const q = seg(t, t0, t0+(dur||0.55), E.outExpo);
  el.style.transform = `translateY(${(1-q)*112}%)`;
  return q;
}
function grow(id, t, t0, dur, axis){
  const q = seg(t, t0, t0+(dur||0.45), E.outExpo);
  $(id).style.transform = (axis==='y') ? `scaleY(${q})` : `scaleX(${q})`;
  $(id).style.opacity = q>0?1:0;
  return q;
}
function show(id, t, a, b){
  const v = t>=a-0.02 && t<b+0.02;
  $(id).style.display = v?'block':'none';
  return v;
}

/* ---------- HUD por frame ---------- */
const T0_SEG = 3*86400 + 7*3600 + 41*60 + 22;   /* 03 d 07:41:22 */
function hudFrame(t, inv){
  const bone='245,243,238', ink='13,12,10';
  const mixc = (a)=>`rgba(${inv>.5?ink:bone},${a})`;
  const app = seg(t, 0.28, 0.75, E.outCubic);
  hud.style.opacity = app;
  $('hframe').style.borderColor = mixc(.16);
  [...document.querySelectorAll('.htick')].forEach(el=>{
    el.style.borderColor = inv>.5 ? '#12100c' : '#c9a96e';
    el.style.opacity = .85;
  });
  $('hbrand').style.color = mixc(.75);
  $('hidx').style.color = mixc(.75);
  $('hclbl').style.color = mixc(.55);
  $('hsite').style.color = mixc(.6);
  $('hticker').style.color = mixc(1);
  /* índice de placa */
  let i = 0;
  BEATS.forEach((k,ix)=>{ if (t>=TL[k].in) i=ix; });
  $('hidx').textContent = String(i+1).padStart(2,'0')+'/12';
  /* cronómetro: corre hasta el reveal, ahí se pone en cero */
  const reset = seg(t, TL.b11.in, TL.b11.in+0.5, E.outExpo);
  const secs = Math.floor((T0_SEG + t*1.0) * (1-reset));
  const d = Math.floor(secs/86400), h = Math.floor(secs%86400/3600), m = Math.floor(secs%3600/60), s = secs%60;
  const p2 = n=>String(n).padStart(2,'0');
  const cl = $('hclock');
  cl.textContent = `${p2(d)} d ${p2(h)}:${p2(m)}:${p2(s)}`;
  cl.style.color = reset>.9 ? '#c9a96e' : mixc(.95);
  if (reset>.9 && inv>.5) cl.style.color = '#7a5f26';
  $('hclbl').textContent = reset>.9 ? 'TIEMPO DE RESPUESTA' : 'SIN RESPONDER';
  /* ticker vertical lento */
  $('hticker').style.transform = `rotate(90deg) translateX(${(t*26)%900 - 100}px) translateY(0)`;
}

  if(!show('b1',t,TL.b1.in,TL.b1.cut)) return;
  wipe('b1w', t, TL.b1.w, 0.5);
  aberr($('b1w'), Math.max(0,.9-(t-TL.b1.w)*1.1));
  const c = seg(t, TL.b1.chk, TL.b1.chk+0.3, E.outBack);
  $('b1chk').style.opacity = c*(0.75+0.25*Math.sin(t*7));
  $('b1chk').style.transform = `scale(${lerp(.5,1,c)})`;
}
function b2(t){
  if(!show('b2',t,TL.b2.in,TL.b2.cut)) return;

  wipe('b2w2', t, TL.b2.w2, 0.5);
  aberr($('b2w2'), Math.max(0,.8-(t-TL.b2.w2)*1.2));
}
function b3(t){
  if(!show('b3',t,TL.b3.in,TL.b3.cut)) return;
  grow('b3blk', t, TL.b3.blk, 0.34, 'y');
  wipe('b3w1', t, TL.b3.w1, 0.45);
  wipe('b3w2', t, TL.b3.w2, 0.45);
  aberr($('b3w2'), Math.max(0,.6-(t-TL.b3.w2)*1.2));
  $('b3lbl').style.opacity = seg(t, TL.b3.lbl, TL.b3.lbl+0.4, E.outCubic);
}
function b4(t){
  if(!show('b4',t,TL.b4.in,TL.b4.cut)) return;
  const q = seg(t, TL.b4.num, TL.b4.num+0.4, E.outExpo);
  const el = $('b4num');
  el.textContent = Math.round(kf(t,[{t:TL.b4.num,v:0},{t:TL.b4.num+0.95,v:800,e:E.outQuint}]));
  el.style.opacity = q;
  el.style.transform = `scale(${lerp(1.3,1,q)})`;
  aberr(el, Math.max(0,.8-(t-TL.b4.num)*1.2));
  const l = seg(t, TL.b4.lbl, TL.b4.lbl+0.4, E.outCubic);
  $('b4stack').style.opacity = l;
  $('b4stack').style.transform = `translateX(${lerp(-40,0,l)}px)`;
  grow('b4rule', t, TL.b4.lbl+0.2, 0.4);
  $('b4sub').style.opacity = seg(t, TL.b4.lbl+0.45, TL.b4.lbl+0.85, E.outCubic);
}
function b5(t){
  if(!show('b5',t,TL.b5.in,TL.b5.cut)) return;
  grow('b5r1', t, TL.b5.r1, 0.5);
  grow('b5r2', t, TL.b5.r1+0.12, 0.5);
  wipe('b5w1', t, TL.b5.w, 0.5);
  wipe('b5w2', t, TL.b5.w+0.42, 0.5);
}
function b6(t){
  if(!show('b6',t,TL.b6.in,TL.b6.cut)) return;
  const q = seg(t, TL.b6.w1, TL.b6.w1+0.4, E.outCubic);
  $('b6w1').style.opacity = q*.75;
  $('b6w1').style.transform = `translateY(${lerp(20,0,q)}px)`;
  grow('b6r', t, TL.b6.r, 0.4);
  wipe('b6w2', t, TL.b6.w2, 0.5);
  aberr($('b6w2'), Math.max(0,.8-(t-TL.b6.w2)*1.2));
}
function b7(t){
  if(!show('b7',t,TL.b7.in,TL.b7.cut)) return;
  EXC.forEach(e=>{
    const q = seg(t, e.t0, e.t0+0.3, E.outExpo);
    e.row.style.opacity = q;
    e.row.style.transform = `translateX(${lerp(50,0,q)}px)`;
    const w = e.txt_.offsetWidth + 20;
    const s = seg(t, e.t0+0.36, e.t0+0.66, E.outExpo);
    e.line.style.width = w+'px';
    e.line.style.transform = `scaleX(${s}) rotate(-1.2deg)`;
    e.line.style.opacity = s>0?1:0;
    e.txt_.style.color = s>.6 ? 'rgba(245,243,238,.4)' : '#f5f3ee';
  });
}
function b8(t){
  if(!show('b8',t,TL.b8.in,TL.b8.cut)) return;
  const bq = seg(t, TL.b8.box, TL.b8.box+0.4, E.outBack);
  $('b8box').style.opacity = bq;
  $('b8box').style.transform = `scale(${lerp(1.25,1,bq)})`;
  const q1 = seg(t, TL.b8.w1, TL.b8.w1+0.35, E.outCubic);
  $('b8w1').style.opacity = q1;
  $('b8w1').style.letterSpacing = lerp(.55,.24,q1)+'em';
  const q2 = seg(t, TL.b8.w2, TL.b8.w2+0.4, E.outExpo);
  $('b8w2').style.opacity = q2;
  $('b8w2').style.transform = `scale(${lerp(1.5,1,q2)}) rotate(${lerp(-3,0,q2)}deg)`;
}
function b9(t){
  if(!show('b9',t,TL.b9.in,TL.b9.cut)) return;
  const q = seg(t, TL.b9.w1, TL.b9.w1+0.4, E.outCubic);
  $('b9w1').style.opacity = q*.7;
  $('b9w1').style.transform = `translateY(${lerp(20,0,q)}px)`;
  wipe('b9w2', t, TL.b9.w2, 0.5);
  wipe('b9w3', t, TL.b9.w3, 0.5);
  aberr($('b9w3'), Math.max(0,1-(t-TL.b9.w3)*1.1));
}
function b10(t){
  if(!show('b10',t,TL.b10.in,TL.b10.cut)) return;
  wipe('b10w1', t, TL.b10.w1, 0.5);
  grow('b10r', t, TL.b10.w1+0.4, 0.4);
  wipe('b10w2', t, TL.b10.w2, 0.5);
  aberr($('b10w2'), Math.max(0,.7-(t-TL.b10.w2)*1.2));
}
function b11(t){
  if(!show('b11',t,TL.b11.in,TL.b11.cut)) return;
  const rq = seg(t, TL.b11.r, TL.b11.r+0.4, E.outBack);
  $('b11r').style.opacity = rq;
  $('b11r').style.transform = `scale(${lerp(.5,1,rq)}) rotate(${lerp(-8,0,rq)}deg)`;
  scramble($('b11logo'), 'RESPONDE', t, TL.b11.logo, TL.b11.logoEnd);
  aberr($('b11logo'), Math.max(0,.9-(t-TL.b11.logo)*0.8));
  grow('b11rule', t, TL.b11.logoEnd, 0.45);
  const tg = seg(t, TL.b11.tag, TL.b11.tag+0.45, E.outCubic);
  $('b11tag').style.opacity = tg;
  $('b11tag').style.transform = `translateY(${lerp(22,0,tg)}px)`;
}
function b12(t){
  if(!show('b12',t,TL.b12.in,1e9)) return;
  wipe('b12w1', t, TL.b12.w1, 0.5);
  wipe('b12w2', t, TL.b12.w2, 0.5);
  const bq = seg(t, TL.b12.btn, TL.b12.btn+0.45, E.outBack);
  const br = 1 + 0.025*Math.sin((t-TL.b12.btn)*2.3);
  $('b12btn').style.opacity = bq;
  $('b12btn').style.transform = `translateX(-50%) scale(${bq<1?lerp(.6,1,bq):br})`;
  $('b12site').style.opacity = seg(t, TL.b12.site, TL.b12.site+0.4, E.outCubic);
}

window.seek = function(t){
  const paper = paperF(t);
  /* el HUD también se invierte sobre la placa dorada del golpe 03 */
  const inv = Math.max(paper, Math.min(seg(t,TL.b3.blk,TL.b3.blk+0.18,E.outCubic), 1-seg(t,TL.b3.cut-0.09,TL.b3.cut-0.01,E.inQuad)));
  setWorld(t, paper);
  camera(t);
  hudFrame(t, inv);
  b1(t);b2(t);b3(t);b4(t);b5(t);b6(t);b7(t);b8(t);b9(t);b10(t);b11(t);b12(t);
};
window.READY = Promise.all([
  document.fonts.load('700 300px Newsreader'),
  document.fonts.load('600 186px Newsreader'),
  document.fonts.load('italic 500 104px Newsreader'),
  document.fonts.load('300 32px "Inter Tight"'),
  document.fonts.load('700 44px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
