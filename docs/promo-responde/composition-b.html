  staggerWords(h2w, t, TL.s1.h2, 0.12, 0.3);
}

  const sk = t>=TL.s3.skip;
  $('b_skip').style.display = sk?'block':'none';
  if (sk) scramble($('b_skip'), '——— MIÉRCOLES · 10:00 ———', t, TL.s3.skip, TL.s3.skip+0.5);
  const rv = t>=TL.s3.rem;
  $('b_rem').style.display = rv?'block':'none';
  if (rv) popIn($('b_rem'), t, TL.s3.rem, 0.3);
  const kv = t>=TL.s3.rok;
  $('b_rok').style.display = kv?'block':'none';
  if (kv) popIn($('b_rok'), t, TL.s3.rok, 0.3);
  /* chips */
  B_CHIPS.forEach((ch,i)=>{
    const t0 = TL.s3.st2+0.25 + i*0.3;
    const q = seg(t, t0, t0+0.4, E.outBackS);
    const qo = 1 - seg(t, TL.s3.tw1-0.3, TL.s3.tw1+0.1, E.inQuad);
    ch.el.style.opacity = q*qo;
    ch.el.style.transform = `translateY(${lerp(34,0,q) + Math.sin(t*1.6+i*2.1)*6}px)`;
  });
  /* slots */
  slotEls.forEach((s,i)=>{
    const q = seg(t, s.cfg.t0, s.cfg.t0+0.4, E.outBackS);
    let qo = 1;
    if (i<3) qo = 1 - seg(t, TL.s3.st5-0.3, TL.s3.st5, E.inQuad) * 0; /* quedan */
    s.el.style.opacity = q*qo*(i<3 ? (1 - seg(t, TL.s3.tw1-0.3, TL.s3.tw1+0.1, E.inQuad)*0) : 1);
    s.el.style.transform = `translateY(${lerp(30,0,q)}px) scale(${lerp(.8,1,q)}) rotate(${(i%2?1.5:-1.5)*(1-q)*3}deg)`;
    if (s.cfg.book && t>=TL.s3.book){
      s.lab.textContent = 'RESERVADO ✓';
      s.lab.style.color = '#8a6f3c';
      const bq = 1+0.12*Math.exp(-6*Math.max(0,t-TL.s3.book))*Math.sin((t-TL.s3.book)*22);
      s.el.style.borderLeftColor = '#5f8a55';
      if (t<TL.s3.book+0.4) s.el.style.transform += ` scale(${bq})`;
    }
  });
  /* contador final */
  const cf = seg(t, TL.s3.fill0-0.15, TL.s3.fill0+0.25, E.outCubic);
  $('b_cnt').style.opacity = cf;
  bOdoSet(kf(t,[{t:TL.s3.fill0,v:3},{t:TL.s3.fill1,v:12,e:E.inOutCubic}]));
}
function s4(t){
  const on = t>=TL.whipD.a && t<TL.whipE.b-0.15;
  $('s4').style.display = on?'block':'none';
  if (!on) return;
  staggerWords(s4h1w, t, TL.s4.h1, 0.1, 0.32);
  const h2 = seg(t, TL.s4.h2, TL.s4.h2+0.4, E.outExpo);
  $('s4h2').style.opacity = h2;
  $('s4h2').style.transform = `translateY(${lerp(36,0,h2)}px) scale(${lerp(1.25,1,h2)})`;
  $('s4h2').textContent = 'Sin llamadas perdidas.';
  $('s4lbl').style.opacity = seg(t, TL.s4.lbl, TL.s4.lbl+0.45, E.outCubic);
}
function s5(t){
  const on = t>=TL.whipE.a;
  $('s5').style.display = on?'block':'none';
  if (!on) return;
  const rq = seg(t, TL.s5.in-0.2, TL.s5.in+0.25, E.outExpo);
  $('s5r').style.opacity = rq;
  $('s5r').style.transform = `scale(${lerp(.5,1,rq)})`;
  const lg = seg(t, TL.s5.in, TL.s5.in+0.4, E.outExpo);
  $('s5logo').style.opacity = lg;
  $('s5logo').style.transform = `scale(${lerp(1.35,1,lg)})`;
  $('s5mode').style.opacity = seg(t, TL.s5.in+0.3, TL.s5.in+0.7, E.outCubic);
  const tg = seg(t, TL.s5.in+0.55, TL.s5.in+1.0, E.outCubic);
  $('s5tag').style.opacity = tg;
  $('s5tag').style.transform = `translateY(${lerp(24,0,tg)}px)`;
  const ct = seg(t, TL.s5.cta, TL.s5.cta+0.45, E.outBack);
  $('s5cta').style.opacity = ct;
  $('s5cta').style.transform = `translateX(-50%) scale(${ct<1?lerp(.6,1,ct):1+0.02*Math.sin((t-TL.s5.cta)*2.2)})`;
  $('s5site').style.opacity = seg(t, TL.s5.cta+0.3, TL.s5.cta+0.7, E.outCubic);
}

window.seek = function(t){
  setWorld(t, paperF(t));
  camera(t);
  s1(t); s2(t); s3(t); s4(t); s5(t);
};
window.READY = Promise.all([
  document.fonts.load('600 170px Newsreader'),
  document.fonts.load('italic 500 88px Newsreader'),
  document.fonts.load('300 26px "Inter Tight"'),
  document.fonts.load('700 26px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
