/* ==================================================================
   VIDEO H · "EL MUNDO CAMBIÓ" · ONE SHOT
   Un solo plano continuo: la cámara arranca sobre una hoja de máquina
   de escribir, baja por una pared de archivo (2016→2026), se aleja
   para mostrarla entera y termina en el remate. Sin cortes, sin
   fundidos, sin flashes: todo es movimiento de cámara.
   Todo el material es de archivo PROPIO (nada de medios reales).
   ================================================================== */
window.DURATION = 47.2;

/* ---------- LA TOMA ----------
   Un solo plano. Coordenadas en espacio de la hoja; camera() convierte
   al espacio de cámara (después del 93% de margen seguro).
   r = roll (inclinación). Las piezas tienen profundidad (data-k):
   k<1 están lejos, k>1 pegadas al lente. De ahí salen el parallax y
   el desenfoque de campo.                                            */
const CAM = [
  {t:0.00,  x:470, y:560,  s:2.30, r:-1.2},  /* muy cerrado sobre la tecla */
  {t:3.30,  x:500, y:585,  s:1.95, r:-0.5},
  {t:5.40,  x:540, y:890,  s:0.95, r: 0.2},  /* grúa atrás: la hoja entera */
  {t:7.00,  x:430, y:1800, s:0.72, r: 1.4},  /* cae y rola */
  {t:8.80,  x:540, y:2679, s:0.76, r: 0.4},  /* 2016 */
  {t:10.80, x:690, y:2380, s:1.28, r:-0.6},  /* dolly lateral al titular */
  {t:12.20, x:520, y:3060, s:2.50, r: 1.8},  /* se mete en la oscuridad */
  {t:13.80, x:700, y:4318, s:0.82, r:-0.5},  /* sale abriendo en 2019 */
  {t:15.60, x:690, y:4090, s:1.28, r: 0.3},
  {t:17.00, x:430, y:5250, s:1.85, r:-1.6},  /* pasa rozando un recorte */
  {t:18.60, x:540, y:6000, s:0.80, r: 0.5},  /* 2021 */
  {t:20.40, x:600, y:5830, s:1.26, r:-0.4},
  {t:21.80, x:760, y:6880, s:2.30, r: 1.5},  /* oscuridad */
  {t:23.40, x:640, y:7560, s:1.10, r:-0.6},  /* 2023 */
  {t:25.20, x:580, y:7720, s:1.28, r: 0.2},
  {t:26.60, x:560, y:8650, s:1.45, r:-1.2},
  {t:28.40, x:560, y:9717, s:0.76, r: 0.4},  /* 2026 */
  {t:30.20, x:580, y:9400, s:1.22, r:-0.3},
  {t:33.00, x:540, y:6215, s:0.21, r: 1.0},  /* se eleva: toda la pared */
  {t:35.80, x:540, y:10850,s:1.55, r:-1.4},  /* se zambulle en lo oscuro */
  {t:37.20, x:540, y:11276,s:1.00, r: 0.3},
  {t:39.40, x:540, y:12423,s:1.00, r:-0.3},
  {t:41.60, x:540, y:13407,s:1.00, r: 0.25},
  {t:44.00, x:540, y:14949,s:1.00, r: 0},
  {t:47.20, x:540, y:14975,s:1.03, r: 0},
];
const SK = 0.93;
const CX = CAM.map(k=>({t:k.t,v:k.x,e:E.inOutCubic}));
const CY = CAM.map(k=>({t:k.t,v:k.y,e:E.inOutCubic}));
const CS = CAM.map(k=>({t:k.t,v:k.s,e:E.inOutCubic}));
const CR = CAM.map(k=>({t:k.t,v:k.r,e:E.inOutCubic}));

function camAt(t){
  const xs=kf(t,CX), ys=kf(t,CY), s=kf(t,CS);
  return { xs, ys, s, roll:kf(t,CR), x:540+(xs-540)*SK, y:960+(ys-960)*SK };
}
/* las piezas y su profundidad, medidas una sola vez */
let PIECES = null;
function collectPieces(){
  PIECES = [...document.querySelectorAll('#stage .pc')].map(el=>({
    el, k:parseFloat(el.dataset.k)||1, rot:parseFloat(el.dataset.rot)||0,
    bx: el.offsetLeft + el.offsetWidth/2, by: el.offsetTop + el.offsetHeight/2
  }));
}
function parallax(c){
  if(!PIECES) collectPieces();
  for (const p of PIECES){
    const ox = (c.xs - p.bx) * (1 - p.k);
    const oy = (c.ys - p.by) * (1 - p.k);
    p.el.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px) scale(${p.k}) rotate(${p.rot}deg)`;
    /* profundidad de campo: enfoca el plano de las tapas (k=1).
       En plano abierto casi no hay desenfoque, como una lente real. */
    const dof = Math.min(1, c.s*1.25);
    const b = (p.k>1 ? (p.k-1)*15 : (1-p.k)*6.5) * dof;
    p.el.style.filter = b>0.35 ? `blur(${b.toFixed(2)}px)` : 'none';
  }
}
function camera(t){
  const c = camAt(t), c2 = camAt(t+1/60);
  const v = Math.hypot((c2.x-c.x)*c.s, (c2.y-c.y)*c.s) + Math.abs(c2.s-c.s)/c.s*900;
  const blur = Math.min(7, Math.max(0, (v-8)*0.19));
  const bx = Math.sin(t*0.62)*4 + Math.sin(t*1.7)*1.6;
  const by = Math.cos(t*0.5)*4.5 + Math.sin(t*1.3)*1.6;
  const rot = c.roll + Math.sin(t*0.33)*0.35 + Math.sin(t*0.9)*0.12;
  const cam = $('camera');
  cam.style.transform = `translate(540px,960px) rotate(${rot}deg) scale(${c.s}) translate(${-(c.x+bx)}px,${-(c.y+by)}px)`;
  cam.style.filter = blur>0.25 ? `blur(${blur.toFixed(2)}px)` : 'none';
  parallax(c);
  const gi = Math.floor(t*24)%9;
  $('grainD').style.transform = `translate(${(gi%3)*-22}px,${Math.floor(gi/3)*-18}px)`;
  /* luz que barre al cruzar por lo oscuro: no es un corte, es una lente */
  let fl = 0;
  for (const [tt,amp] of [[12.9,.30],[22.5,.28],[36.4,.34]]){
    const d = Math.abs(t-tt);
    if (d < .85) fl = Math.max(fl, amp*(1-d/.85));
  }
  $('flash').style.opacity = fl;
  $('blackout').style.opacity = Math.max(1-seg(t,0,0.5,E.outQuad), seg(t,46.55,47.15,E.inQuad));
  return c;
}

  <div class="mask" style="left:0;top:20px;width:1080px;position:relative;"><span id="f2" class="seri tan" style="font-size:130px;font-weight:600;">Menos vos.</span></div>
</div>
<div style="position:absolute;left:0;top:12300px;width:1080px;text-align:center;">
  <div class="mask" style="left:0;top:0;width:1080px;position:relative;"><span id="f3" class="ser bone" style="font-size:88px;font-weight:600;">Seguís vendiendo</span></div>
  <div class="mask" style="left:0;top:14px;width:1080px;position:relative;"><span id="f4" class="ser tan" style="font-size:88px;font-weight:700;">como en 2016.</span></div>
</div>
<div style="position:absolute;left:60px;top:13300px;width:960px;text-align:center;">
  <div class="mask" style="left:0;top:0;width:960px;position:relative;"><span id="f5" class="ser bone" style="font-size:76px;font-weight:600;">No te quejes si los resultados</span></div>
  <div class="mask" style="left:0;top:12px;width:960px;position:relative;"><span id="f6" class="ser bone" style="font-size:76px;font-weight:600;">no son los mismos.</span></div>
</div>
<div style="position:absolute;left:0;top:14700px;width:1080px;text-align:center;">
  <div id="rbox" class="rbox" style="display:inline-grid;width:130px;height:130px;font-size:70px;"></div>
  <div id="rlogo" class="ser bone" style="font-size:150px;font-weight:600;letter-spacing:-.02em;margin-top:44px;"></div>
  <div id="rrule" style="width:480px;height:2px;background:#c9a96e;margin:26px auto 0;transform-origin:50% 50%;"></div>
  <div id="rtag" class="seri tan" style="font-size:50px;font-weight:500;margin-top:30px;">El que contesta primero.</div>
  <div id="rbtn" class="pill" style="display:inline-block;font-size:42px;white-space:nowrap;padding:32px 66px;margin-top:52px;">Probame ahora →</div>
  <div id="rsite" class="lbl bone" style="font-size:26px;letter-spacing:.3em;margin-top:44px;">RESPONDE · by Metogroup · metogroup.ar</div>
</div>`;

const st2 = document.createElement('style');
st2.textContent = `.mask{overflow:hidden;line-height:1.28;padding-bottom:10px;} .mask>span{display:inline-block;}`;
document.head.appendChild(st2);

/* ---------- animación mínima: sólo lo que "ocurre" en el plano ---------- */
const TW = 'EL MUNDO CAMBIÓ.';
const TW_T0 = 0.45, TW_T1 = 3.25;
window.TYPE = {txt:TW, t0:TW_T0, t1:TW_T1};

function wipeAt(id, t, t0, dur){
  const q = seg(t, t0, t0+dur, E.outExpo);
  $(id).style.transform = `translateY(${(1-q)*115}%)`;
}

window.seek = function(t){
  setWorld(t, 0);
  const c = camera(t);
  /* tipeo */
  const n = Math.round(seg(t, TW_T0, TW_T1, E.linear) * TW.length);
  $('tw').textContent = TW.slice(0, n);
  $('twc').style.opacity = t < TW_T1+0.6 ? (Math.floor(t*2.6)%2?1:.12) : 0;
  /* HUD: el año sale de dónde está mirando la cámara */
  const yr = Math.round(clamp01((c.ys-2679)/(9717-2679))*10) + 2016;
  $('hyear').textContent = c.ys < 2100 ? '2016' : (c.ys > 10400 ? '2026' : yr);
  $('hbarf').style.width = (clamp01((c.ys-890)/(9717-890))*100).toFixed(1)+'%';
  $('hsite').style.opacity = t>42 ? 0 : .5;    /* al final lo dice el propio cartel */
  /* remates: aparecen cuando la cámara llega */
  wipeAt('f1', t, 37.05, 0.7);  wipeAt('f2', t, 37.85, 0.75);
  wipeAt('f3', t, 39.30, 0.65); wipeAt('f4', t, 39.95, 0.7);
  wipeAt('f5', t, 41.50, 0.65); wipeAt('f6', t, 42.15, 0.7);
  /* cierre */
  const rq = seg(t, 43.9, 44.4, E.outExpo);
  $('rbox').style.opacity = rq; $('rbox').textContent = 'R';
  $('rbox').style.transform = `scale(${lerp(.55,1,rq)})`;
  scramble($('rlogo'), 'RESPONDE', t, 44.2, 45.4);
  const ru = seg(t, 45.4, 45.9, E.outExpo);
  $('rrule').style.transform = `scaleX(${ru})`; $('rrule').style.opacity = ru;
  const tg = seg(t, 45.6, 46.1, E.outCubic);
  $('rtag').style.opacity = tg; $('rtag').style.transform = `translateY(${lerp(20,0,tg)}px)`;
  const bq = seg(t, 46.0, 46.5, E.outBack);
  $('rbtn').style.opacity = bq;
  $('rbtn').style.transform = `scale(${bq<1?lerp(.7,1,bq):1+0.02*Math.sin((t-46.0)*2.4)})`;
  $('rsite').style.opacity = seg(t, 46.3, 46.8, E.outCubic);
};
window.READY = Promise.all([
  document.fonts.load('700 150px Newsreader'),
  document.fonts.load('600 166px Newsreader'),
  document.fonts.load('italic 500 50px Newsreader'),
  document.fonts.load('700 62px "Courier Prime"'),
  document.fonts.load('300 20px "Inter Tight"'),
  document.fonts.load('700 42px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
</body>
</html>
