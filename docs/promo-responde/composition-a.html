    $('s2src').style.opacity = seg(t, TL.s2.stat+0.8, TL.s2.stat+1.2, E.outCubic);
  }
}
function s3(t){
  const on = t>=11.55 && t<16.73;
  $('s3').style.display = on?'block':'none';
  if (!on) return;
  const rq = seg(t, TL.s3.in+0.1, TL.s3.in+0.55, E.outBack);
  $('s3r').style.opacity = rq;
  $('s3r').style.transform = `scale(${lerp(.5,1,rq)}) rotate(${lerp(-8,0,rq)}deg)`;
  scramble($('s3lbl'), 'ETAPA 00 · ATENCIÓN AUTOMATIZADA', t, TL.s3.in+0.35, TL.s3.in+1.25);
  scramble($('s3logo'), 'RESPONDE', t, TL.s3.logo, TL.s3.logoEnd);
  aberr($('s3logo'), t>TL.s3.logo ? Math.max(0,.9-(t-TL.s3.logo)*0.7) : 0);
  const ru = seg(t, TL.s3.logoEnd, TL.s3.logoEnd+0.5, E.outExpo);
  $('s3rule').style.transform = `scaleX(${ru})`;
  const tg = seg(t, TL.s3.tag, TL.s3.tag+0.55, E.outCubic);
  $('s3tag').style.opacity = tg;
  $('s3tag').style.transform = `translateY(${lerp(30,0,tg)}px)`;
  $('s3tag').textContent = 'El primer empleado que nunca se cansa.';
  const sb = seg(t, TL.s3.tag+0.4, TL.s3.tag+0.9, E.outCubic);
  $('s3sub').style.opacity = sb;
}
function s4(t){
  const on = t>=16.73 && t<TL.whipD.b-0.2;
  $('s4').style.display = on?'block':'none';
  if (!on) return;
  const ph = seg(t, TL.s4.in, TL.s4.in+0.6, E.outExpo);
  $('phoneA').style.transform = `translateY(${lerp(700,0,ph)}px) scale(${lerp(.93,1,ph)})`;
  $('phoneA').style.opacity = ph;
  /* step label con decode */
  let idx=-1;
  for (let i=0;i<STEPS_A.length;i++) if (t>=STEPS_A[i].t) idx=i;
  if (idx>=0){
    const st=STEPS_A[idx];
    const nxt = idx<STEPS_A.length-1 ? STEPS_A[idx+1].t : 1e9;
    let o = 1-seg(t, nxt-0.16, nxt, E.inQuad);
    if (idx===2) o *= 1-seg(t, 23.4, 24.0, E.inQuad); /* el zoom del typing lo cortaría */
    $('s4step').style.opacity = o;
    scramble($('s4step'), st.txt.toUpperCase(), t, st.t, st.t+0.55, true);
  } else $('s4step').style.opacity = 0;
  /* mensajes */
  popIn($('a_in1'), t, TL.s4.msg1);
  typingDots($('a_typ'), t, TL.s4.typ0, TL.s4.typ1);
  const o1 = t>=TL.s4.typ1;
  $('a_out1').style.display = o1?'block':'none';
  if (o1) popIn($('a_out1'), t, TL.s4.typ1, 0.3);
  const n = twCount(t);
  $('a_tw').textContent = REPLY_A.slice(0,n);
  $('a_caret').style.opacity = (t>TL.s4.typ1 && t<TL.s4.tw1+0.5) ? (Math.floor(t*2.6)%2?1:.1) : 0;
  popIn($('a_in2'), t, TL.s4.msg2);
  const o2v = t>=TL.s4.out2;
  $('a_out2').style.display = o2v?'block':'none';
  if (o2v) popIn($('a_out2'), t, TL.s4.out2, 0.3);
  /* chips */
  A_CHIPS.forEach((ch,i)=>{
    const t0 = TL.s4.st2+0.25 + i*0.3;
    const q = seg(t, t0, t0+0.4, E.outBackS);
    const qo = 1 - seg(t, TL.s4.tw1-0.2, TL.s4.tw1+0.2, E.inQuad);
    ch.el.style.opacity = q*qo;
    ch.el.style.transform = `translateY(${lerp(34,0,q) + Math.sin(t*1.6+i*2.1)*6}px)`;
  });
  /* multicanal */
  let chan = 'WhatsApp';
  for (const [tt,name] of CHANS) if (t>=tt) chan=name;
  const chEl = $('chan');
  chEl.textContent = chan;
  let chPulse = 1;
  for (const [tt] of CHANS) if (t>tt && t<tt+0.3) chPulse = 1+0.14*Math.sin(iv(t,tt,tt+0.3)*Math.PI);
  chEl.style.transform = `scale(${chPulse})`;
  chEl.style.background = chPulse>1.005 ? 'rgba(201,169,110,.2)' : 'transparent';
  /* niveles */
  const bg = Math.min(seg(t, TL.s4.st5+0.05, TL.s4.st5+0.4, E.outCubic), 1);
  $('a_nivbg').style.opacity = bg*.9;
  nivEls.forEach((el,i)=>{
    const t0 = TL.s4.st5+0.15+i*0.22;
    const q = seg(t, t0, t0+0.4, E.outExpo);
    el.style.opacity = q;
    el.style.transform = `translateX(${lerp(120,0,q)}px)`;
  });
  if (bg===0){ nivEls.forEach(el=>{el.style.opacity=0;}); }
}
function s5(t){
  const on = t>=TL.whipD.a && t<TL.whipE.b-0.2;
  $('s5').style.display = on?'block':'none';
  if (!on) return;
  const lq = seg(t, TL.s5.in-0.25, TL.s5.in+0.2, E.outExpo);
  $('s5lbl').style.opacity = lq;
  $('s5odo').style.opacity = lq;
  const val = kf(t,[{t:TL.s5.roll0,v:23},{t:TL.s5.roll1,v:0,e:E.inOutCubic}]);
  s5odoSet(val);
  const rg = seg(t, TL.s5.roll1+0.05, TL.s5.roll1+0.45, E.outBack);
  $('s5ring').style.opacity = rg;
  $('s5ring').style.transform = `scale(${lerp(.4,1,rg)})`;
  staggerWords(s5h1w, t, TL.s5.h1, 0.09, 0.3);
  const h2 = seg(t, TL.s5.h2, TL.s5.h2+0.4, E.outExpo);
  $('s5h2').style.opacity = h2;
  $('s5h2').style.transform = `translateY(${lerp(36,0,h2)}px) scale(${lerp(1.25,1,h2)})`;
  $('s5h2').textContent = 'Nunca más.';
  $('s5sub').style.opacity = seg(t, TL.s5.h2+0.4, TL.s5.h2+0.85, E.outCubic);
}
function s6(t){
  const on = t>=TL.whipE.a;
  $('s6').style.display = on?'block':'none';
  if (!on) return;
  const rq = seg(t, TL.s6.in-0.22, TL.s6.in+0.25, E.outExpo);
  $('s6r').style.opacity = rq;
  $('s6r').style.transform = `scale(${lerp(.5,1,rq)})`;
  const lg = seg(t, TL.s6.in, TL.s6.in+0.4, E.outExpo);
  $('s6logo').style.opacity = lg;
  $('s6logo').style.transform = `scale(${lerp(1.35,1,lg)})`;
  $('s6by').style.opacity = seg(t, TL.s6.in+0.3, TL.s6.in+0.7, E.outCubic);
  const tg = seg(t, TL.s6.in+0.55, TL.s6.in+1.0, E.outCubic);
  $('s6tag').style.opacity = tg;
  $('s6tag').style.transform = `translateY(${lerp(24,0,tg)}px)`;
  const ct = seg(t, TL.s6.cta, TL.s6.cta+0.45, E.outBack);
  $('s6cta').style.opacity = ct;
  $('s6cta').style.transform = `translateX(-50%) scale(${ct<1?lerp(.6,1,ct):1+0.02*Math.sin((t-TL.s6.cta)*2.2)})`;
  $('s6site').style.opacity = seg(t, TL.s6.cta+0.3, TL.s6.cta+0.7, E.outCubic);
}

window.seek = function(t){
  setWorld(t, paperF(t));
  camera(t);
  s1(t); s2(t); s3(t); s4(t); s5(t); s6(t);
};
window.READY = Promise.all([
  document.fonts.load('600 186px Newsreader'),
  document.fonts.load('italic 500 110px Newsreader'),
  document.fonts.load('300 26px "Inter Tight"'),
  document.fonts.load('700 26px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
</script>
