const ecgLine = $('ecgline'), ecgDot = $('ecgdot');
function ecgFrame(t){
  /* estado del pulso → color */
  const flat = t>=FLAT.a && t<FLAT.b;
  let col = '#c9a96e';
  if (t>9.4 && t<16.9) col = '#e0864e';           // taquicardia
  else if (t>=16.9 && t<FLAT.a) col = '#d9614f';  // se apaga
  if (flat) col = '#e0483f';                       // paro
  if (t>=TL.b10.in) col = '#c9a96e';               // reanimado
  ecgLine.setAttribute('stroke', col);
  ecgDot.setAttribute('fill', col);
  /* trazo: la derecha es "ahora", se corre hacia la izquierda */
  const mid = ECG_H/2;
  const SPD = ecgSpeedAt(t);            /* se arrastra al apagarse */
  let pts = '';
  let lastY = mid;
  for (let x=0; x<=ECG_W; x+=3){
    const tt = t - (ECG_W - x)/SPD;
    let y = 0;
    for (const b of HB){
      const u = (tt - b.t)/(b.d||0.42);
      if (u>=0 && u<=1) y += b.a * pqrst(u);
    }
    const yy = mid - y*ECG_H*0.42;
    if (x===ECG_W) lastY = yy;
    pts += x+','+yy.toFixed(1)+' ';
  }
  ecgLine.setAttribute('points', pts);
  ecgDot.setAttribute('cx', ECG_W);
  ecgDot.setAttribute('cy', lastY.toFixed(1));
  /* opacidad del trazo: aparece con el HUD */
  $('ecgw').style.opacity = seg(t,0.3,0.85,E.outCubic);
  /* LPM */
  const bpmEl = $('bpm');
  if (flat){
    bpmEl.textContent = '—';
    bpmEl.style.color = '#e0483f';
    $('bpml').textContent = 'SIN PULSO';
    $('bpml').style.color = 'rgba(224,72,63,.75)';
    bpmEl.style.opacity = (Math.floor(t*2.2)%2) ? 1 : .35;
  } else {
    let prev=null, cur=null;
    for (const b of HB){ if (b.t<=t){ prev=cur; cur=b; } }
    let v = 72;
    if (cur && prev) v = Math.round(60/(cur.t-prev.t));
    else if (t<0.3) v = 72;
    if (t>=TL.b10.in && t<35.3) v = Math.round(lerp(36, 64, iv(t,33.3,35.2)));
    bpmEl.textContent = Math.max(0,Math.min(190,v));
    bpmEl.style.color = col;
    bpmEl.style.opacity = 1;
    $('bpml').textContent = 'LPM';
    $('bpml').style.color = 'rgba(245,243,238,.5)';
  }
}

const T0_SEG = 3*86400 + 7*3600 + 41*60 + 22;
function hudFrame(t, inv){
  const bone='245,243,238', ink='13,12,10';
  const mixc = a=>`rgba(${inv>.5?ink:bone},${a})`;
  hud.style.opacity = seg(t,0.28,0.75,E.outCubic);
  $('hframe').style.borderColor = mixc(.16);
  [...document.querySelectorAll('.htick')].forEach(el=>{
    el.style.borderColor = inv>.5 ? '#12100c' : '#c9a96e'; el.style.opacity=.85;
  });
  $('hbrand').style.color = mixc(.75);
  $('hidx').style.color = mixc(.75);
  $('hclbl').style.color = mixc(.5);
  $('hsite').style.color = mixc(.55);
  let i=0; BEATS.forEach((k,ix)=>{ if (t>=TL[k].in) i=ix; });
  $('hidx').textContent = String(i+1).padStart(2,'0')+'/13';
  const reset = seg(t, TL.b10.in, TL.b10.in+0.5, E.outExpo);
  const secs = Math.floor((T0_SEG + t)*(1-reset));
  const d=Math.floor(secs/86400), h=Math.floor(secs%86400/3600), m=Math.floor(secs%3600/60), s=secs%60;
  const p2 = n=>String(n).padStart(2,'0');
  const cl = $('hclock');
  cl.textContent = `${p2(d)} d ${p2(h)}:${p2(m)}:${p2(s)}`;
  cl.style.color = reset>.9 ? (inv>.5?'#7a5f26':'#c9a96e') : mixc(.95);
  $('hclbl').textContent = reset>.9 ? 'TIEMPO DE RESPUESTA' : 'SIN RESPONDER';
}

/* helpers */

function show(id,t,a,b){ const v=t>=a-0.02&&t<b+0.02; $(id).style.display=v?'block':'none'; return v; }

/* teléfono: explota en b4, revive en b11 */
function phone(t){
  const inA = t>=TL.b4.in-0.02 && t<TL.b4.cut+0.02;
  const inB = t>=TL.b11.in-0.02 && t<TL.b11.cut+0.02;
  $('bphone').style.display = (inA||inB)?'block':'none';
  if(!inA && !inB) return;
  const t0 = inA ? TL.b4.ph : TL.b11.ph;
  const q = seg(t,t0,t0+0.5,E.outExpo);
  /* temblor propio del teléfono cuando explota */
  const sh = inA ? Math.max(0,seg(t,7.0,7.4,E.outCubic)-seg(t,10.2,10.55,E.outCubic)) : 0;
  const jx = sh*Math.sin(t*33)*7, jy = sh*Math.cos(t*29)*5;
  $('phone').style.opacity=q;
  $('phone').style.transform=`translate(${jx}px,${lerp(120,0,q)+jy}px) scale(${lerp(.92,1,q)})`;
  const num = $('phnum');
  if (inA){
    /* filas cayendo + contador subiendo a 800 */
    rowEls.forEach((r,i)=>{
      const rt = TL.b4.rows + i*0.16;
      const rq = seg(t,rt,rt+0.3,E.outExpo);
      r.el.style.opacity=rq;
      r.el.style.transform=`translateY(${lerp(-40,0,rq)}px)`;
      r.badge.style.display='inline-grid'; r.ok.style.display='none';
      r.badge.textContent = Math.max(1, Math.round(ROWS[i][4]*Math.min(1,seg(t,rt,rt+1.6,E.outCubic)*1.15)));
      r.prev.textContent = ROWS[i][2]; r.time.style.color='#25D366';
    });
    const v = Math.round(kf(t,[{t:TL.b4.num,v:0},{t:TL.b4.num+2.3,v:800,e:E.outQuint}]));
    $('phcount').textContent = v+' sin leer';
    $('phcount').style.color = '#25D366';
    num.style.fontSize='150px'; num.style.fontWeight='700';
    num.style.color='#e0483f';
    num.textContent = v;
    num.style.opacity = seg(t,TL.b4.num+0.2,TL.b4.num+0.6,E.outCubic);
    num.style.transform = `scale(${1+0.02*Math.sin(t*9)})`;
  } else {
    /* revivido: badges → ✓✓, contador a 0 */
    rowEls.forEach((r,i)=>{
      const rt = TL.b11.clear + i*0.12;
      const done = t>=rt;
      r.el.style.opacity=1; r.el.style.transform='none';
      r.badge.style.display = done?'none':'inline-grid';
      r.ok.style.display = done?'block':'none';
      r.badge.textContent = ROWS[i][4];
      r.prev.textContent = done ? 'Respondido por RESPONDE' : ROWS[i][2];
      r.prev.style.color = done ? '#c9a96e' : '#8696a0';
      r.time.style.color = done ? '#8696a0' : '#25D366';
    });
    const left = ROWS.reduce((acc,r,i)=> acc + (t>=TL.b11.clear+i*0.12?0:r[4]), 0);
    const v = Math.round(800*(left/84));
    $('phcount').textContent = (t>TL.b11.clear+7*0.12+0.2?'0':v)+' sin leer';
    $('phcount').style.color = (t>TL.b11.clear+7*0.12+0.2)?'#c9a96e':'#25D366';
    num.style.fontSize='150px'; num.style.color='#c9a96e'; num.style.fontWeight='700';
    num.textContent = (t>TL.b11.clear+7*0.12+0.2)?'0':v;
    num.style.opacity = seg(t,TL.b11.clear,TL.b11.clear+0.4,E.outCubic);
    num.style.transform='scale(1)';
  }
}
