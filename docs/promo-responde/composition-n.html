/* la barra del día, por frame */
function hudFrame(t, inv){
  const bone='245,243,238', ink='13,12,10';
  const mixc = a=>`rgba(${inv>.5?ink:bone},${a})`;
  hud.style.opacity = seg(t,0.25,0.7,E.outCubic);
  $('hfr').style.borderColor = mixc(.13);
  let comidas=0; XS.forEach(x=>{ if(t>=x) comidas++; });
  let devueltas=0; OKS.forEach(o=>{ if(t>=o) devueltas++; });
  const enPanico = t>=TL.b8.in && t<TL.b9.r;
  BX.forEach((b,i)=>{
    const roja = t>=XS[i] && t<OKS[i];
    const oro  = t>=OKS[i];
    const grow = roja ? seg(t,XS[i],XS[i]+0.35,E.outCubic) : (oro ? seg(t,OKS[i],OKS[i]+0.3,E.outCubic) : 0);
    b.fill.style.transform = `scaleX(${grow})`;
    const blink = enPanico ? (0.55+0.45*Math.abs(Math.sin(t*3.2+i))) : 1;
    b.fill.style.background = oro ? '#c9a96e' : `rgba(224,72,63,${(0.85*blink).toFixed(2)})`;
    b.box.style.borderColor = oro ? '#c9a96e' :
      (roja ? `rgba(224,72,63,${(0.8*blink).toFixed(2)})` : (inv>.5?'rgba(13,12,10,.45)':'rgba(245,243,238,.35)'));
  });
  const libres = Math.max(0, 8 - comidas);   /* de día: sólo se come; de vuelta: se recupera */
  const ctrl = $('hctrl');
  ctrl.textContent = devueltas>0 ? `PARA CREAR ${devueltas}:00` : `PARA CREAR ${libres}:00`;
  ctrl.style.color = devueltas>0 ? '#c9a96e' : (comidas>0 ? '#e0483f' : '#c9a96e');
  $('hbarlbl').textContent = devueltas===8 ? 'TU DÍA · TUYO OTRA VEZ' : 'TU DÍA · 8 HORAS';
  $('hbarlbl').style.color = devueltas===8 ? '#c9a96e' : mixc(.42);
  [...document.querySelectorAll('.tk')].forEach(el=> el.style.borderColor = inv>.5 ? '#12100c' : (enPanico?'#e0483f':'#c9a96e'));
  $('hsite').style.color = mixc(.4);
}

window.seek = function(t){
  const paper = paperF(t);
  setWorld(t, paper);
  camera(t);
  hudFrame(t, paper);

  if (show('b1',t,TL.b1.in,TL.b1.cut)){
    wipe('b1w1',t,TL.b1.w1,0.55);
    wipe('b1w2',t,TL.b1.w2,0.6);
    aberr($('b1w2'), Math.max(0,.9-(t-TL.b1.w2)*1.2));
  }
  if (show('b2',t,TL.b2.in,TL.b2.cut)){
    Q2.forEach(q=>{
      const p = seg(t,q.t0,q.t0+0.32,E.outExpo);
      q.row.style.opacity=p;
      q.row.style.transform=`translateX(${lerp(46,0,p)}px)`;
    });
  }
  if (show('b3',t,TL.b3.in,TL.b3.cut)){
    wipe('b3w1',t,TL.b3.w1,0.5); wipe('b3w1b',t,TL.b3.w1+0.18,0.5);
    wipe('b3w2',t,TL.b3.w2,0.6);
    aberr($('b3w2'), Math.max(0,.8-(t-TL.b3.w2)*1.2));
  }
  if (show('b4',t,TL.b4.in,TL.b4.cut)){
    wipe('b4w1',t,TL.b4.w1,0.5); wipe('b4w1b',t,TL.b4.w1+0.18,0.5);
    wipe('b4w2',t,TL.b4.w2,0.6);
    aberr($('b4w2'), Math.max(0,.8-(t-TL.b4.w2)*1.2));
  }
  if (show('b5',t,TL.b5.in,TL.b5.cut)){
    wipe('b5w1',t,TL.b5.w1,0.5);
    wipe('b5w2',t,TL.b5.w2,0.5);
    wipe('b5w3',t,TL.b5.w3,0.55);
    aberr($('b5w3'), Math.max(0,.8-(t-TL.b5.w3)*1.2));
  }
  if (show('b6',t,TL.b6.in,TL.b6.cut)){
    wipe('b6w1',t,TL.b6.w1,0.55);
    wipe('b6w2',t,TL.b6.w2,0.6);
  }
  if (show('b6b',t,TL.b6b.in,TL.b6b.cut)){
    const h = seg(t,TL.b6b.w0,TL.b6b.w0+0.4,E.outCubic);
    $('b6bhdr').style.opacity=h;
    $('b6bhdr').style.transform=`translateY(${lerp(18,0,h)}px)`;
    l6bels.forEach((l,i)=>{
      const p = seg(t,l.t0,l.t0+0.4,E.outExpo);
      l.row.style.opacity=p;
      l.row.style.transform=`translateX(${lerp(40,0,p)}px)`;
      l.dn.textContent = t>=l.t0+0.22 ? '↓' : '';
    });
  }
  if (show('b7',t,TL.b7.in,TL.b7.cut)){
    wipe('b7w1',t,TL.b7.w1,0.6); wipe('b7w1b',t,TL.b7.w1+0.18,0.6);
    aberr($('b7w1'), Math.max(0,1-(t-TL.b7.w1)*1.1));
    wipe('b7w2',t,TL.b7.w2,0.6);
  }
  show('b8',t,TL.b8.in,TL.b8.cut);
  if (show('b9',t,TL.b9.in,TL.b9.cut)){
    const rq = seg(t,TL.b9.r,TL.b9.r+0.4,E.outBack);
    $('b9r').style.opacity=rq;
    $('b9r').style.transform=`scale(${lerp(.5,1,rq)}) rotate(${lerp(-8,0,rq)}deg)`;
    scramble($('b9logo'),'RESPONDE',t,TL.b9.logo,TL.b9.logoEnd);
    aberr($('b9logo'), Math.max(0,.9-(t-TL.b9.logo)*0.8));
    const ru=seg(t,TL.b9.logoEnd,TL.b9.logoEnd+0.45,E.outExpo);
    $('b9rule').style.transform=`scaleX(${ru})`; $('b9rule').style.opacity=ru;
    const tg=seg(t,TL.b9.tag,TL.b9.tag+0.45,E.outCubic);
    $('b9tag').style.opacity=tg;
    $('b9tag').style.transform=`translateY(${lerp(22,0,tg)}px)`;
  }
  if (show('b10',t,TL.b10.in,TL.b10.cut)){
    l10els.forEach(l=>{
      const p = seg(t,l.t0,l.t0+0.4,E.outExpo);
      l.row.style.opacity=p;
      l.row.style.transform=`translateX(${lerp(40,0,p)}px)`;
      l.ok.textContent = t>=l.t0+0.22 ? '✓' : '';
    });
  }
  if (show('b11',t,TL.b11.in,TL.b11.cut)){
    wipe('b11w',t,TL.b11.w,0.55);
    wipe('b11w2',t,TL.b11.w+0.5,0.6);
    aberr($('b11w2'), Math.max(0,.8-(t-TL.b11.w-0.5)*1.2));
  }
  if (show('b12',t,TL.b12.in,1e9)){
    const rq=seg(t,TL.b12.in+0.05,TL.b12.in+0.5,E.outBack);
    $('cr').style.opacity=rq;
    const breath = 0.75+0.25*Math.sin((t-47)*2*Math.PI/2.1);
    $('cr').style.transform=`scale(${lerp(.55,1,rq)})`;
    $('cr').style.boxShadow=`0 0 ${Math.round(26*breath)}px rgba(201,169,110,${(0.32*breath).toFixed(2)})`;
    /* la estrella: decode + halo que respira + destello */
    scramble($('clogo'),'RESPONDE',t,TL.b12.logo,TL.b12.logo+1.15);
    const shim = Math.max(0, 1 - Math.abs(t-TL.b12.shimmer)/0.30);
    aberr($('clogo'), Math.max(Math.max(0,.9-(t-TL.b12.logo)*0.8), shim*.85));
    $('cglow').style.opacity = seg(t,TL.b12.logo,TL.b12.logo+1.2,E.outCubic)*(0.55+0.25*Math.sin((t-46)*2*Math.PI/3.4)) + shim*0.5;
    const ru=seg(t,TL.b12.rule,TL.b12.rule+0.5,E.outExpo);
    $('crule').style.transform=`scaleX(${ru})`; $('crule').style.opacity=ru;
    const tg=seg(t,TL.b12.tag,TL.b12.tag+0.5,E.outCubic);
    $('ctag').style.opacity=tg; $('ctag').style.transform=`translateY(${lerp(20,0,tg)}px)`;
    const bq=seg(t,TL.b12.btn,TL.b12.btn+0.45,E.outBack);
    $('cbtn').style.opacity=bq;
    $('cbtn').style.transform=`translateX(-50%) scale(${bq<1?lerp(.6,1,bq):1+0.022*Math.sin((t-TL.b12.btn)*2.0)})`;
    $('csite').style.opacity=seg(t,TL.b12.site,TL.b12.site+0.5,E.outCubic);
  }
};

/* ==================================================================
   PASE DE LEGIBILIDAD EN CELULAR
   El motivo real de que la letra se viera rota y apagada: Newsreader
   es una fuente variable y trae el eje opsz (tamaño óptico). Chrome
   lo autoajusta al cuerpo, así que a 72–160 px estaba usando el corte
   de display, el de los perfiles más finos (~2 px a 1080). El H.264
   se come esos perfiles y en el teléfono la letra queda deshilachada.
   Acá se fuerza opsz 12 —el corte de texto, de trazo grueso—, se sube
   el peso, se aclaran los tonos y se corre la grana y las líneas de
   barrido de encima de la tipografía.
   ================================================================== */
const css3 = document.createElement('style');
css3.textContent = `
  .ser,.seri,.ans,.qt,.lt,.lt2,.rbox,.mono,.ghostnum {
    font-variation-settings:'opsz' 12;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }
  .ser { font-weight:700 !important; }

  .bone,.qt,.lt,.lt2 { color:#ffffff; }
  .tan  { color:#e8c583; }
  .ans  { color:#f2cf8d; }
  .qn   { color:#e8c583; font-weight:400; }
  .lok,.rbox { border-color:#e8c583; color:#e8c583; border-width:3px; }
  .ldn  { border-color:#f0594c; color:#f0594c; border-width:3px; }
  .dim  { color:rgba(245,243,238,.60); }

  /* separación del fondo. Va en el contenedor y no en el texto porque
     aberr() reescribe text-shadow cuadro a cuadro. */
  .mask,.qrow,.lrow,#b9logo,#b9tag,#clogo,#ctag,#b6bhdr,#b7w2,#cbtn {
    filter: drop-shadow(0 3px 12px rgba(0,0,0,.62)) drop-shadow(0 0 34px rgba(0,0,0,.42));
  }
  /* sobre papel el contraste ya está: el halo negro solo ensuciaría */
  #b6 .mask, #b11 .mask { filter:none; }

  #hud .mo { font-weight:500; }

  /* Los renglones de una sola línea: el corte de texto y el peso 700
     ensanchan la letra, así que estas frases se pasaban del marco.
     Se recuperan con tracking cerrado y un ajuste chico de cuerpo —
     el trazo grueso las hace leer más grandes igual. */
  #b1w2   { font-size:95px !important; letter-spacing:-.055em; }
  #b11w2  { font-size:69px !important; letter-spacing:-.06em; }
  #b11w   { letter-spacing:-.05em; }
  #b6w1   { letter-spacing:-.05em; }
  .lt2    { font-size:50px !important; letter-spacing:-.045em; }
  .lt     { letter-spacing:-.04em; }
  #b9logo { font-size:146px !important; letter-spacing:-.04em; }
  #clogo  { font-size:144px !important; letter-spacing:-.04em; }
`;
document.head.appendChild(css3);

/* el HUD también se leía como polvo en el celular */
(function(){
  document.querySelectorAll('#hud .mo').forEach(el=>{
    const fs=parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize=(fs*1.16).toFixed(1)+'px';
  });
})();

/* hudFrame reescribe los colores del HUD en cada cuadro, así que el
   pase de brillo tiene que ir después de él. De paso, el rótulo de
   arriba a la izquierda no giraba a tinta sobre las placas de papel:
   quedaba claro sobre claro. */
const REMAP = { 'rgb(201, 169, 110)':'#e8c583', 'rgb(224, 72, 63)':'#f0594c' };
const _hudFrame = hudFrame;
hudFrame = function(t, inv){
  _hudFrame(t, inv);
  const c = a => `rgba(${inv>.5 ? '13,12,10' : '245,243,238'},${a})`;
  $('hlbl').style.color = c(.80);
  $('hfr').style.borderColor = c(.20);
  $('hsite').style.color = c(.56);
  if (!$('hbarlbl').style.color.startsWith('#') &&
      !$('hbarlbl').style.color.startsWith('rgb(201')) $('hbarlbl').style.color = c(.60);
  ['hctrl','hbarlbl'].forEach(id=>{
    const e=$(id), m=REMAP[e.style.color]; if(m) e.style.color=m;
  });
  document.querySelectorAll('#hud .tk').forEach(e=>{
    const m=REMAP[e.style.color] || REMAP[e.style.borderColor];
    if(m) e.style.borderColor=m;
    e.style.opacity = '.92';
  });
  BX.forEach(b=>{
    const mf=REMAP[b.fill.style.background];   if(mf) b.fill.style.background=mf;
    const mb=REMAP[b.box.style.borderColor];   if(mb) b.box.style.borderColor=mb;
    else if (b.box.style.borderColor==='rgba(245, 243, 238, 0.35)') b.box.style.borderColor='rgba(245,243,238,.52)';
    else if (b.box.style.borderColor==='rgba(13, 12, 10, 0.45)')    b.box.style.borderColor='rgba(13,12,10,.60)';
  });
};

/* viñeta menos cerrada: apagaba la letra en los bordes del cuadro */
$('vigD').style.background =
  'radial-gradient(ellipse 134% 100% at 50% 44%, transparent 62%, rgba(0,0,0,.34) 100%)';

/* grana y barrido: dejan de comerse los perfiles de la letra */
const _setWorld = setWorld;
setWorld = function(t, paper){
  _setWorld(t, paper);
  $('grainD').style.opacity = .048 * (1 - paper);
  $('grainP').style.opacity = .055 * paper;
  $('scan').style.opacity   = .016 * (1 - paper) + .010 * paper;
};

/* la franja de color en los golpes, a la mitad: sumaba al deshilachado */
const _aberr = aberr;
aberr = function(el, amt){ _aberr(el, amt * 0.55); };

window.READY = Promise.all([

  document.fonts.load('600 160px Newsreader'),

  document.fonts.load('600 36px "IBM Plex Mono"'),
  document.fonts.load('700 42px "Inter Tight"'),
  document.fonts.ready
]).then(()=>{ window.seek(0); return true; });
