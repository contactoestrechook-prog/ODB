# ODB en el servidor propio (Akamai São Paulo, 21/10/2026).
# Lo levanta infra/servidor/publicar.sh. A mano, desde /srv/odb, SIEMPRE con la
# versión publicada:  VERSION=$(cat VERSION) docker compose --env-file hosts.env up -d
# Sin VERSION se niega a arrancar: el 2/11/2026 un `up` sin ella levantó la API con
# una imagen vieja («actual», del 21/10) y el bot estuvo 6 horas sin contestar.
# Los secretos viven en /srv/odb/secretos/*.env (permisos 600, nunca en el repo).
name: odb

x-comun: &comun
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }
  networks: [interna]

services:
  proxy:
    <<: *comun
    image: caddy:2.10
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HOST_API: ${HOST_API}
      HOST_PANEL: ${HOST_PANEL}
      HOST_TIENDA: ${HOST_TIENDA}
      HOST_WAHA: ${HOST_WAHA}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    mem_limit: 128m
    networks: [interna, publica]

  api:
    <<: *comun
    image: odb-api:${VERSION:?falta VERSION (la publicada está en /srv/odb/VERSION)}
    build: { context: ./codigo/apps/api, dockerfile: ../../infra/servidor/api.Dockerfile, args: { VERSION: "${VERSION}" } }
    env_file: [./secretos/api.env]
    # certificados de ARCA (ARCA_*_PATH): archivos 400 del usuario node
    volumes: ["./secretos/archivos:/run/secretos:ro"]
    mem_limit: 1g
    cap_drop: [ALL]

  admin:
    <<: *comun
    image: odb-admin:${VERSION:?falta VERSION}
    build: { context: ./codigo/apps/admin, dockerfile: ../../infra/servidor/next.Dockerfile, args: { VERSION: "${VERSION}" } }
    env_file: [./secretos/admin.env]
    mem_limit: 512m
    cap_drop: [ALL]
    depends_on: [api]

  web:
    <<: *comun
    image: odb-web:${VERSION:?falta VERSION}
    build: { context: ./codigo/apps/web, dockerfile: ../../infra/servidor/next.Dockerfile, args: { VERSION: "${VERSION}" } }
    env_file: [./secretos/web.env]
    mem_limit: 384m
    cap_drop: [ALL]
    depends_on: [api]

  waha:
    <<: *comun
    # versión fija: el «latest» le cambió el comportamiento a otro proyecto el 5/10
    image: devlikeapro/waha:${WAHA_VERSION:-noweb}
    env_file: [./secretos/waha.env]
    volumes: ["waha-sesiones:/app/.sessions"]
    mem_limit: 1536m

  # La línea general (11 2281-2200) en un WAHA aparte con el motor GOWS
  # (1/11/2026). Con NOWEB se cortaba ~54 veces por día («Stream Errored (ack)»)
  # y cada tanto quedaba conectada pero sin poder leer los mensajes. El motor
  # se elige por contenedor, no por sesión: el de arriba sigue con NOWEB para la
  # línea del local. La API elige cuál usar con WAHA_GOWS_URL y WAHA_GOWS_SESIONES.
  waha-gows:
    <<: *comun
    image: devlikeapro/waha:${WAHA_VERSION:-noweb}
    env_file: [./secretos/waha.env]
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
    volumes: ["waha-gows-sesiones:/app/.sessions"]
    mem_limit: 1g

  # GPS de los vehículos (3/11/2026). Traccar habla con los equipos (Teltonika
  # en el 5027, Concox/GT06 en el 5023) y le reenvía cada posición a la API
  # (/gps/traccar), que la pone en el mapa de flota y en el seguimiento de los
  # envíos. Los equipos se dan de alta solos (DATABASE_REGISTER_UNKNOWN): lo que
  # importa es cargar el IMEI en el vehículo, en Reparto › Repartidores.
  # Sin perfil a propósito: con perfil, el --remove-orphans de publicar.sh puede
  # tomarlo por huérfano y bajarlo en cada publicación. Publicar «api admin» no
  # lo levanta; se prende una sola vez, cuando haya equipo: GPS_TOKEN en
  # hosts.env (la misma que en secretos/api.env), los puertos abiertos en el
  # firewall de Akamai y
  #   VERSION=$(cat VERSION) docker compose --env-file hosts.env up -d traccar
  traccar:
    <<: *comun
    image: traccar/traccar:6.16.0-alpine
    ports: ["5027:5027", "5023:5023"]
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_REGISTER_UNKNOWN: "true"
      FORWARD_TYPE: json
      FORWARD_URL: http://api:3001/gps/traccar
      FORWARD_HEADER: "x-gps-token: ${GPS_TOKEN:-}"
      FORWARD_RETRY_ENABLE: "true"
    volumes: ["traccar-datos:/opt/traccar/data", "traccar-registros:/opt/traccar/logs"]
    mem_limit: 512m
    networks: [interna, publica]
    depends_on: [api]

volumes:
  caddy-datos:
  caddy-config:
  waha-sesiones:
  waha-gows-sesiones:
  traccar-datos:
  traccar-registros:

networks:
  interna: {}
  publica: {}
